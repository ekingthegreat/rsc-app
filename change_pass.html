<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password - RSC</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/cs s/change_pass.css" />

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="assets/js/firebaseconfig.js"></script>
</head>

<body>
  <div class="header">
    <h1>RSC</h1>
    <small>Ready to serve the community</small>
  </div>

  <div class="main-container">
    <div class="content">
      <div class="page-title">
        <div class="title-left">
          <button class="back-btn">
            <i class="fas fa-arrow-left"></i>
          </button>
          <h2>Change Password</h2>
        </div>
        <button class="hamburger-btn">
          <i class="fas fa-ellipsis-v"></i>
        </button>

        <div class="hamburger-menu">
          <a href="edit_profile.html" class="menu-item">
            <i class="fas fa-user-edit"></i>
            <span>Edit Profile</span>
          </a>
          <a href="change_pass.html" class="menu-item">
            <i class="fas fa-lock"></i>
            <span>Change Password</span>
          </a>
        </div>
      </div>

      <div class="form-section">
        <div class="form-header">
          <div class="form-icon">
            <i class="fas fa-lock"></i>
          </div>
          <div class="form-title">Update Your Password</div>
          <div class="form-subtitle">Create a strong and secure password</div>
        </div>

        <div class="form-container">
          <div class="form-group">
            <label for="currentpass" class="form-label">Current Password</label>
            <input type="password" id="currentpass" class="form-input" placeholder="Enter your current password">
            <button class="password-toggle" type="button">
              <i class="far fa-eye"></i>
            </button>
          </div>

          <div class="form-group">
            <label for="newpass" class="form-label">New Password</label>
            <input type="password" id="newpass" class="form-input" placeholder="Enter your new password">
            <button class="password-toggle" type="button">
              <i class="far fa-eye"></i>
            </button>

            <div class="password-strength">
              <div class="password-strength-bar" id="password-strength-bar"></div>
            </div>
            <div class="password-strength-text" id="password-strength-text"></div>
          </div>

          <div class="form-group">
            <label for="confirmpass" class="form-label">Confirm Password</label>
            <input type="password" id="confirmpass" class="form-input" placeholder="Confirm your new password">
            <button class="password-toggle" type="button">
              <i class="far fa-eye"></i>
            </button>
          </div>

          <button class="save-btn" id="save-btn">Save Changes</button>
        </div>

        <div class="logout-section">
          <button class="logout-btn">Log Out</button>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-container">
      <a href="home.html" class="nav-item">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="track.html" class="nav-item">
        <i class="fas fa-map-marker-alt"></i>
        <span>Track</span>
      </a>
        <a href="response.html" class="nav-item" id="response-nav-item" style="display: none;">
        <i class="fas fa-bullhorn"></i>
        <span>Response</span>
      </a>

      <a href="notification.html" class="nav-item">
        <i class="fas fa-bell"></i>
        <span>Notification</span>
      </a>
      <a href="history.html" class="nav-item">
        <i class="fas fa-history"></i>
        <span>History</span>
      </a>
      <a href="captain.html" class="nav-item" id="captain-nav-item" style="display: none;">
        <i class="fas fa-users-cog"></i>
        <span>Mng User</span>
      </a>

      <a href="profile.html" class="nav-item active">
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </a>
    </div>
  </div>
<script src="assets/js/session.js"></script>
  <script src="assets/js/change.js"> </script>
</body>

</html>
