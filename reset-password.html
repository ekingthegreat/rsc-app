<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - RSC</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <link rel="stylesheet" href="assets/css/reset.css">
</head>
<body>
  <div class="top-header">
    <h1>RSC</h1>
    <span>Ready to Serve the Community</span>
  </div>

  <div class="container">
    <div class="header">
      <h2>Reset Password</h2>
      <p>Enter your new password</p>
    </div>

    <div class="form-box">
      <div class="error-message" id="errorMessage" style="display: none;"></div>
      <div class="success-message" id="successMessage" style="display: none;"></div>
      
      <form id="resetPasswordForm">
        <label for="newPassword">New Password</label>
        <div class="password-wrapper">
          <input type="password" id="newPassword" placeholder="Enter new password" required />
          <span class="toggle-password" onclick="togglePassword('newPassword')">
            <i class="fas fa-eye"></i>
          </span>
        </div>

        <label for="confirmPassword">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirmPassword" placeholder="Confirm new password" required />
          <span class="toggle-password" onclick="togglePassword('confirmPassword')">
            <i class="fas fa-eye"></i>
          </span>
        </div>

        <button type="submit" id="submitBtn">Reset Password</button>
      </form>

      <p class="login-text">
        <a href="login.html">Back to Sign In</a>
      </p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="assets/js/firebaseconfig.js"></script>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/reset.js"></script>
</body>
</html>
