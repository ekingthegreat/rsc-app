<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password - RSC</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/forgot_change.css" />
</head>
<body>
  <div class="top-header">
    <h1>RSC</h1>
    <span>Ready to Serve the Community</span>
  </div>

  <div class="container">
    <div class="header">
      <h2>Change Password</h2>
      <p>Secure your account with a new password</p>
    </div>

    <div class="form-box">
      <form id="passwordForm">
        <label for="newPassword">New Password</label>
        <div class="password-wrapper">
          <input type="password" id="newPassword" placeholder="Enter new password" required />
          <span class="toggle-password" onclick="togglePassword('newPassword')">
            <i class="fas fa-eye"></i>
          </span>
        </div>

        <label for="confirmPassword">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirmPassword" placeholder="Confirm password" required />
          <span class="toggle-password" onclick="togglePassword('confirmPassword')">
            <i class="fas fa-eye"></i>
          </span>
        </div>

        <button type="submit">Change Password</button>
      </form>
    </div>

    <div class="footer">
      <p>By changing your password, you agree to our<br />
        <a href="#">Terms of Service</a> | <a href="#">Privacy Policy</a>
      </p>
    </div>
  </div>
<script src="assets/js/session.js"></script>
  <script src="assets/js/forgot.js"></script>
</body>
</html>
