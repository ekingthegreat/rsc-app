<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile - RSC</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/edit_profile.css" />
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
 <script src="assets/js/firebaseconfig.js"></script>
</head>

<body>
  <div class="header">
    <h1>RSC</h1>
    <small>Ready to serve the community</small>
  </div>

  <div class="main-container">
    <div class="content">
      <div class="page-title">
        <div class="title-left">
          <button class="back-btn">
            <i class="fas fa-arrow-left"></i>
          </button>
          <h2>Edit Profile</h2>
        </div>
        <button class="hamburger-btn">
          <i class="fas fa-ellipsis-v"></i>
        </button>

        <div class="hamburger-menu">
          <a href="edit_profile.html" class="menu-item">
            <i class="fas fa-user-edit"></i>
            <span>Edit Profile</span>
          </a>
          <a href="change_pass.html" class="menu-item">
            <i class="fas fa-lock"></i>
            <span>Change Password</span>
          </a>
        </div>
      </div>

      <div class="profile-section">
        <div class="profile-header">
          <div class="profile-name" id="profile-name">Loading...</div>
        </div>

        <div class="form-container">
          <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" class="form-input" placeholder="Enter your username">
          </div>

          <div class="form-group">
            <label for="fullname" class="form-label">Full Name</label>
            <input type="text" id="fullname" class="form-input" placeholder="Enter your full name">
          </div>

          <div class="form-group">
            <label for="contact" class="form-label">Contact Number</label>
            <input type="text" id="contact" class="form-input" placeholder="09xx-xxx-xxxx">
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-input" placeholder="Enter your email">
          </div>

          <div class="form-group">
            <label for="address" class="form-label">Address</label>
            <input type="text" id="address" class="form-input" placeholder="Enter your address">
          </div>

          <button class="save-btn" id="save-btn">Save Changes</button>
        </div>

        <div class="logout-section">
          <button class="logout-btn">Log Out</button>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-container">
      <a href="home.html" class="nav-item">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="track.html" class="nav-item">
        <i class="fas fa-map-marker-alt"></i>
        <span>Track</span>
      </a>
        <a href="response.html" class="nav-item" id="response-nav-item" style="display: none;">
        <i class="fas fa-bullhorn"></i>
        <span>Response</span>
      </a>

      <a href="notification.html" class="nav-item">
        <i class="fas fa-bell"></i>
        <span>Notification</span>
      </a>
      <a href="history.html" class="nav-item">
        <i class="fas fa-history"></i>
        <span>History</span>
      </a>
      <a href="captain.html" class="nav-item" id="captain-nav-item" style="display: none;">
        <i class="fas fa-users-cog"></i>
        <span>Mng User</span>
      </a>
      <a href="profile.html" class="nav-item active">
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </a>
    </div>
  </div>
<script src="assets/js/block.js"></script>
<script src="assets/js/session.js"></script>
<script src="assets/js/firebaseconfig.js"></script>
  <script src="assets/js/editprofile.js"></script>
</body>

</html>
