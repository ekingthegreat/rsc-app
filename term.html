<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms & Privacy | RSC Dashboard</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/term.css">
</head>
<body>
    <div class="top-header">
        <div class="header-content">
            <button class="back-button" id="backButton">
                <i class="fas fa-arrow-left"></i>
                <span>Back</span>
            </button>
            <div class="logo-container">
                <h1>RSC</h1>
                <span>Ready to Serve the Community</span>
            </div>
            <div class="header-spacer"></div> 
        </div>
    </div>

    <main>
        <div class="profile-card">
            <div class="profile-card-header">
                <div class="profile-card-title">
                    <h2><i class="fas fa-file-contract"></i> Terms and Privacy Policy</h2>
                </div>
            </div>
            
          
            <div class="policy-container">
                <div class="policy-column" id="privacy-policy">
                    <div class="policy-header">
                        <div>
                            <h1>Privacy Policy</h1>
                            <p id="privacy-last-updated">Last Updated: December 2024</p>
                        </div>
                    </div>
                    
                    <div class="policy-content" id="privacy-content">
                    </div>
                </div>

                <div class="policy-column" id="terms-of-service">
                    <div class="policy-header">
                        <div>
                            <h1>Terms of Service</h1>
                            <p id="terms-last-updated">Last Updated: December 2024</p>
                        </div>
                    </div>
                    
                    <div class="policy-content" id="terms-content">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="assets/js/firebaseconfig.js"></script>
<script src="assets/js/block.js"></script>
<script src="assets/js/session.js"></script>
    <script src="assets/js/term.js"></script>
</body>
</html>
