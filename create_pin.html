<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create PIN - RSC</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <link rel="stylesheet" href="assets/css/create_pin.css" />
</head>
<body>
  <div class="top-header">
    <h1>RSC</h1>
    <span>Ready to Serve the Community</span>
  </div>

  <div class="container">
    <div class="header">
      <h2>Create Secure PIN</h2>
      <p>Protect your account with a 4-digit personal identification number</p>
    </div>

    <div class="form-box">
      <p class="pin-instructions">Enter your 4-digit PIN using the numeric keypad</p>
      
      <form id="pinForm">
        <div class="pin-container">
          <input type="text" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off" autofocus>
          <input type="text" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
          <input type="text" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
          <input type="text" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
        </div>
        
        <div class="security-note">
          <i class="fas fa-shield-alt"></i>
          <span>Your PIN is encrypted and securely stored</span>
        </div>
        
        <button type="submit" id="submitBtn" disabled>Continue</button>
      </form>
    </div>

    <div class="footer">
      <p>By continuing, you agree to our<br />
        <a href="term.html">Terms of Service</a> • <a href="privacy.html">Privacy Policy</a>
      </p>
    </div>
  </div>
<script src="assets/js/block.js"></script>
  <script src="assets/js/createpin.js"> </script>
</body>
</html>
